defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

args:
  model_name: "FNO"
  continue_training: False
  seed: 1
  split_seed: 0
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  deterministic: False
  run_name: null
  num_workers: 2
  batch_size: 5
  initial_step: 10
  skip_initial_time: 0
  t_train: 101
  filename: ???
  data_path: ${oc.env:IMNO_DATA_ROOT,data}
  save_dir : "./checkpoints"
  reduced_resolution: 1
  reduced_resolution_t: 1
  reduced_batch: 1
  epochs: 500
  learning_rate: 1.e-3
  scheduler_step: 100
  scheduler_gamma: 0.5
  num_channels: 1
  modes: 12
  modes2: 10
  modes3: 8
  modes4: 12
  width: 20
  training_type: "autoregressive"
