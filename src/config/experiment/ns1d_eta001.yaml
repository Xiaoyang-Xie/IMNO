# @package _global_
args:
  model_name: FNO
  continue_training: false
  num_workers: 2
  batch_size: 100
  initial_step: 1
  t_train: 40
  filename: 1D_CFD_Rand_Eta0.01_Zeta0.01_periodic_Train.hdf5
  data_path: ${oc.env:IMNO_DATA_ROOT,data}
  reduced_resolution: 8
  reduced_resolution_t: 1
  reduced_batch: 1
  epochs: 500
  learning_rate: 0.001
  scheduler_step: 100
  scheduler_gamma: 0.5
  num_channels: 3
  modes: 24
  width: 64
  training_type: autoregressive
  alpha: 0.1
  gamma: 1.1
  w_max: 10
  normalize: true
  modes2: 0
  modes3: 6
  modes4: 8
  hidden_states: 32
  shift_equivariant: ${model_shift_equivariant.${args.model_name}}
model_shift_equivariant:
  IMNO: false
  FNO: true
  RNO: true
